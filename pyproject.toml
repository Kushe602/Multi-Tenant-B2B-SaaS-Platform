# Tooling configuration for TenantForge (ruff + pytest).
# Not a packaged project: services are run as top-level modules (e.g.
# `uvicorn identity_service.main:app`).

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
# B008: FastAPI intentionally calls Depends()/Header()/Body()/Form() in defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "identity_service", "tickets_service", "notifications_service", "gateway", "conftest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

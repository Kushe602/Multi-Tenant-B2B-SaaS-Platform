{% if tickets %}
  {% for t in tickets %}
  <button type="button"
          class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left hover:bg-slate-50"
          hx-get="/app/tickets/{{ t.id }}" hx-target="#ticket-detail" hx-swap="innerHTML">
    <span class="min-w-0">
      <span class="block truncate text-sm font-medium text-slate-800">{{ t.subject }}</span>
      <span class="block text-xs text-slate-400">#{{ t.id[:8] }} · {{ t.priority }}</span>
    </span>
    {% set color = 'bg-amber-100 text-amber-800' if t.status == 'open' else ('bg-sky-100 text-sky-800' if t.status == 'pending' else 'bg-emerald-100 text-emerald-800') %}
    <span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium {{ color }}">{{ t.status }}</span>
  </button>
  {% endfor %}
{% else %}
  <div class="px-4 py-8 text-center text-sm text-slate-400">No tickets yet. Create your first one above.</div>
{% endif %}

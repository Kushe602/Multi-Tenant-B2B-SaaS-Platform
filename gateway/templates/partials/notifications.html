{% if notifications %}
  <ul class="divide-y divide-slate-100">
    {% for n in notifications %}
    <li class="px-4 py-3">
      <div class="flex items-center gap-2">
        {% if not n.read %}<span class="h-2 w-2 shrink-0 rounded-full bg-brand-600"></span>{% endif %}
        <p class="text-sm font-medium text-slate-800">{{ n.title }}</p>
      </div>
      <p class="mt-0.5 text-xs text-slate-500">{{ n.body }}</p>
    </li>
    {% endfor %}
  </ul>
{% else %}
  <div class="px-4 py-8 text-center text-sm text-slate-400">No notifications yet.</div>
{% endif %}

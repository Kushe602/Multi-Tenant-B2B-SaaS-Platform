{% extends "base.html" %}
{% block title %}Sign up — TenantForge{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">Create your workspace</h1>
  <p class="mt-1 text-sm text-slate-500">You'll be the owner of a new tenant.</p>
  {% if error %}<div class="mt-4 rounded-md bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ error }}</div>{% endif %}
  <form action="/signup" method="post" class="mt-5 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700">Organization name</label>
      <input name="org_name" required value="{{ org_name or '' }}"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-brand-600 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Your name</label>
      <input name="name" value="{{ name or '' }}"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-brand-600 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Email</label>
      <input name="email" type="email" required value="{{ email or '' }}"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-brand-600 focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input name="password" type="password" required minlength="8"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-brand-600 focus:outline-none" />
      <p class="mt-1 text-xs text-slate-400">At least 8 characters.</p>
    </div>
    <button class="w-full rounded-md bg-brand-600 px-4 py-2 text-white hover:bg-brand-700">Create workspace</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">Already have one? <a href="/login" class="text-brand-700 underline">Log in</a>.</p>
</div>
{% endblock %}
